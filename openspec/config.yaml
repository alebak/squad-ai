# openspec/config.yaml — SDD Project Configuration
# Generated by sdd-init on 2026-05-24
schema: spec-driven

context: |
  Project: squad-ai
  Repository: https://github.com/alebak/squad-ai
  License: MIT
  Status: greenfield (no code yet)
  Developer: learning Go

  Tech stack:
    Language: Go 1.24+
    CLI framework: Cobra (github.com/spf13/cobra)
    TUI: Bubbletea (charm.sh/bubbletea)
    TUI styling: Lipgloss (charm.sh/lipgloss)
    TUI components: Bubbles (charm.sh/bubbles)
    Build & release: GoReleaser
    Runtime detection: command -v for node, go, python3, cargo

  Architecture:
    Package structure:
      cmd/squad/          — Entry point (main.go only)
      internal/cli/       — Cobra command definitions
      internal/tui/       — Bubbletea models and views
      internal/registry/  — Remote registry fetch, cache, parsing
      internal/installer/ — Agent installation and progress tracking
      internal/config/    — User configuration read/write
      internal/runtime/   — Runtime dependency detection (Node.js, Go, Python)

    Config path: ~/.config/squad-ai/ (XDG Base Directory)
    Registry: JSON hosted at raw.githubusercontent.com
    Distribution: Static binary via install.sh + GoReleaser (linux/amd64, linux/arm64)

  Coding style:
    - Idiomatic Go, Effective Go, Go Code Review Comments
    - Exported symbols MUST have godoc comments
    - No global mutable state, pass dependencies explicitly
    - No panic() in library code
    - errors.New() / fmt.Errorf() with %w wrapping
    - Short functions (<40 lines), handle every error
    - Minimize external dependencies, prefer stdlib
    - MixedCaps naming, acronyms uppercase (URL, HTTP, ID)
    - Boolean vars/funcs read as questions: isInstalled, hasRuntime
    - Approved dependencies: cobra, bubbletea, lipgloss, bubbles, testify

  Conventions:
    - Conventional Commits: feat:, fix:, docs:, refactor:, chore:, test:, build:, ci:
    - Branch naming: <type>/<short-description>
    - All changes start with an issue (bug_report.yml / feature_request.yml)
    - PRs reference the issue: Closes #N

rules:
  proposal:
    - Include rollback plan for risky changes
    - Reference the PRD section being addressed
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
    - Include runtime dependency requirements when relevant
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
    - Consider both TUI and non-interactive CLI modes
  tasks:
    - Group by package, use hierarchical numbering
    - Keep tasks completable in one session
    - Separate internal/ package work from cmd/ wiring
  apply:
    - Follow existing code patterns — prioritize clarity over cleverness
    - The developer is learning Go — add comments explaining idiomatic patterns
    tdd: false
    test_command: "go test ./..."
  verify:
    test_command: "go test ./... -v -count=1"
    build_command: "go build ./cmd/squad"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
