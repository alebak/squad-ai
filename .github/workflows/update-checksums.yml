name: update-checksums

on:
  schedule:
    # Daily — upstream install scripts drift often enough to break clean installs.
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: update-checksums
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      SQUAD_CHECKSUM_FAILED_PATH: ${{ runner.temp }}/checksums-failed.txt
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Compute checksums and compare
        id: checksums
        run: |
          set -uo pipefail
          set +e
          go run ./scripts/updatechecksums | tee "${RUNNER_TEMP}/checksums-output.txt"
          status=${PIPESTATUS[0]}
          set -e

          changed="$(grep -E '^CHANGED=' "${RUNNER_TEMP}/checksums-output.txt" | tail -1 | cut -d= -f2- || true)"
          failed="$(grep -E '^FAILED=' "${RUNNER_TEMP}/checksums-output.txt" | tail -1 | cut -d= -f2- || true)"
          changed_ids="$(grep -E '^CHANGED_IDS=' "${RUNNER_TEMP}/checksums-output.txt" | tail -1 | cut -d= -f2- || true)"
          summary="$(grep -E '^SUMMARY=' "${RUNNER_TEMP}/checksums-output.txt" | tail -1 | cut -d= -f2- || true)"

          # go run also exits 1 on compile failure; require sentinel markers so a
          # broken updater cannot look like a successful no-op run.
          if [ -z "$changed" ] || [ -z "$failed" ]; then
            echo "checksum updater produced no sentinel output (status=$status)" >&2
            exit 1
          fi

          echo "CHANGED=${changed}" >> "$GITHUB_OUTPUT"
          echo "FAILED=${failed}" >> "$GITHUB_OUTPUT"
          echo "CHANGED_IDS=${changed_ids:-}" >> "$GITHUB_OUTPUT"
          {
            echo "SUMMARY<<EOF"
            echo "${summary:-}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          # Exit 1 means some downloads failed; still continue so we can open
          # an issue and/or PR for any successful hash updates.
          if [ "$status" -ne 0 ] && [ "$status" -ne 1 ]; then
            echo "checksum updater failed with unexpected status $status" >&2
            exit "$status"
          fi

      - name: Open issue for unreachable scripts
        if: ${{ !cancelled() && steps.checksums.outputs.FAILED == 'true' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const failedPath = process.env.SQUAD_CHECKSUM_FAILED_PATH;
            const failed = fs.existsSync(failedPath)
              ? fs.readFileSync(failedPath, 'utf8').trim()
              : '(no failure details file)';
            const title = 'Checksum update failed for some agents';
            const isLocal = failed.split('\n').every((line) => line.startsWith('LOCAL|'));
            const body = isLocal
              ? [
                  'The checksum updater failed locally before checking upstream scripts:',
                  '',
                  '```',
                  failed,
                  '```',
                ].join('\n')
              : [
                  'The following agent install scripts could not be downloaded:',
                  '',
                  '```',
                  failed,
                  '```',
                  '',
                  'These agents may be unavailable or their URLs may have changed.',
                ].join('\n');

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'bug',
              per_page: 100,
            });
            const existing = issues.data.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Recheck failed again:\n\n\`\`\`\n${failed}\n\`\`\``,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['bug'],
              });
            }

      - name: Open PR for updated checksums
        if: ${{ !cancelled() && steps.checksums.outputs.CHANGED == 'true' }}
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore(registry): update agent checksums"
          title: "chore(registry): update agent checksums"
          body: |
            Checksums for one or more agents changed.

            ## Delta
            ${{ steps.checksums.outputs.SUMMARY }}

            Changed agents: `${{ steps.checksums.outputs.CHANGED_IDS }}`

            This PR updates SHA-256 hashes (and `content_changed_at` / legacy `verified_at`) in `registry/agents.json` when upstream install script **content** changes.

            **Security note:** auto-updates trust current upstream content. Before merging, open each changed URL and review the script diff, not only the hash.
          branch: chore/update-checksums
          delete-branch: true
